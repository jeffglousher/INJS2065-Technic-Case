<text x="400" y="95" text-anchor="middle" font-size="17">BACK</text>
<g fill="#25806b" stroke="#175e4f" stroke-width="2">
<rect x="165" y="156" width="120" height="15"/><rect x="165" y="382" width="120" height="15"/><rect x="165" y="592" width="120" height="15"/>
<rect x="500" y="156" width="86" height="39" rx="4"/><rect x="500" y="382" width="86" height="39" rx="4"/><rect x="500" y="592" width="86" height="39" rx="4"/>
</g>
