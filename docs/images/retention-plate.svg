<title id="title">One PETG plate: six retention test pieces</title>
<desc id="desc">Top view, front at bottom. Left column front to back: lower rail 1, control upper 2, latch upper 3. Right column: control clip 4, latch A 5, latch B 6. Mark pieces before removal.</desc>
